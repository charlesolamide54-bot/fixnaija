<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixNaija Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

	<header class="site-header">
    <div>
        <h1>FixNaija Admin</h1>
        <p>Manage and update community reports.</p>
    </div>

    <button id="logoutButton">Logout</button>
</header>

	<h2>Community Reports</h2>
<p class="admin-label">All Community Reports</p>

<input
    type="text"
    id="searchInput"
    placeholder="Search reports..."
>

<div id="reports"></div>
	
<script>
const user = JSON.parse(localStorage.getItem("user"));

if (!user || user.role !== "admin") {
    alert("Admin access required");
    window.location.href = "index.html";
}

document.getElementById("logoutButton").addEventListener("click", () => {
    localStorage.removeItem("token");
    localStorage.removeItem("user");
    window.location.href = "login.html";
});

const token = localStorage.getItem("token");

if (!token) {
    window.location.href = "login.html";
}

const reportsContainer = document.getElementById("reports");
const searchInput = document.getElementById("searchInput");

let allReports = [];

function displayReports(reports) {
    reportsContainer.innerHTML = "";

    reports.forEach(report => {
        const reportElement = document.createElement("div");
        reportElement.classList.add("report-card");

        reportElement.addEventListener("click", (event) => {
            if (
                event.target.classList.contains("status-select") ||
                event.target.classList.contains("update-button") ||
                event.target.classList.contains("delete-button")
            ) {
                return;
            }

            window.location.href = `report.html?id=${report.id}`;
        });

        reportElement.innerHTML = `
            <h2>#${report.id} — ${report.title}</h2>
            <p>${report.description}</p>
            <p>Category: ${report.category}</p>
            <p>Location: ${report.location}</p>

            <p>
                Current Status:
                <span class="status ${report.status.toLowerCase().replace(" ", "-")}">
                    ${report.status}
                </span>
            </p>

            <button class="delete-button">
                Delete Report
            </button>

            <div class="status-controls">
                <label class="status-label">Change Status</label>

                <select class="status-select">
                    <option value="Reported">Reported</option>
                    <option value="Verified">Verified</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Resolved">Resolved</option>
                </select>

                <button class="update-button">
                    Update Status
                </button>
            </div>

            <hr>
        `;

        const select = reportElement.querySelector(".status-select");
        const button = reportElement.querySelector(".update-button");
        const deleteButton = reportElement.querySelector(".delete-button");

        select.value = report.status;

        deleteButton.addEventListener("click", async (event) => {
            event.stopPropagation();

            const confirmed = confirm(
                "Are you sure you want to delete this report?"
            );

            if (!confirmed) {
                return;
            }

            try {
                const response = await fetch(
                    `http://localhost:5000/api/reports/${report.id}`,
                    {
                        method: "DELETE",
                        headers: {
                            "Authorization": "Bearer " + token
                        }
                    }
                );

                const data = await response.json();

                if (response.ok) {
                    reportElement.remove();
                    alert("Report deleted successfully!");
                } else {
                    alert(data.message);
                }

            } catch (error) {
                alert("Request error: " + error.message);
            }
        });

        button.addEventListener("click", async (event) => {
            event.stopPropagation();

            try {
                const response = await fetch(
                    `http://localhost:5000/api/reports/${report.id}`,
                    {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": "Bearer " + token
                        },
                        body: JSON.stringify({
                            status: select.value
                        })
                    }
                );

                const data = await response.json();

                if (response.ok) {
                    report.status = select.value;
                    alert("Status updated successfully!");
                } else {
                    alert(data.message);
                }

            } catch (error) {
                alert("Request error: " + error.message);
            }
        });

        reportsContainer.appendChild(reportElement);
    });
}

fetch("http://localhost:5000/api/reports")
    .then(response => response.json())
    .then(reports => {
        allReports = reports;
        displayReports(reports);
    })
    .catch(error => {
        console.error(error);
    });

searchInput.addEventListener("input", () => {
    const searchTerm = searchInput.value.toLowerCase();

    const filteredReports = allReports.filter(report =>
        report.title.toLowerCase().includes(searchTerm) ||
        report.category.toLowerCase().includes(searchTerm) ||
        report.location.toLowerCase().includes(searchTerm)
    );

    displayReports(filteredReports);
});
</script>

</body>
</html>
